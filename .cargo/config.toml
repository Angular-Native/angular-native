[alias]
# `cargo an dev` instead of `cargo run -q -p an-cli -- dev`.
an = "run -q -p an-cli --"

# There is deliberately nothing else here.
#
# This file used to carry the Android cross-compilation settings: the NDK's
# clang as the linker, `CC_*` and `AR_*` for the `cc` crate, and a sysroot for
# bindgen. Every one of those lines held an absolute path, and the path held
# three things that are not the repository's to know — which machine
# (`/Users/somebody`), which NDK version (`27.1.12297006`) and which host
# (`darwin-x86_64`). It worked for exactly one laptop. Anybody else cloning
# this got `cc` looking for an `aarch64-linux-android-clang` that does not
# exist, and QuickJS never built.
#
# `an android` works all three out at build time — see `Sdk::cargo_env` in
# `crates/an-cli/src/android.rs` — and hands them to the `cargo` it spawns.
# `scripts/check-cargo-config.sh` is what keeps them from coming back.
