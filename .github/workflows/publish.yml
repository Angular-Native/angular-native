# Publishing the npm packages, on a tag.
#
# The packages are built the same way `an init` vendors them — `ngc` in partial
# mode — because two ways of building them would be two ways for them to differ.
# `check-publish.sh` runs first: `npm publish` will happily ship a tarball with
# no code in it, and a version number cannot be reused once it is taken.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: node scripts/build-packages.mjs
      - run: ./scripts/check-publish.sh
      # `packages/cli` is skipped, and it is the one package that would install
      # cleanly and be useless: what is in the directory is a shim and a
      # manifest, and the SDK payload it needs —`crates/`, `shells/`,
      # `packages/`, `scripts/bundle.mjs`— is copied in at assembly time by
      # `scripts/build-cli.mjs`. Publishing it from here would ship the wrapper
      # with nothing inside. `release.yml`, on the same tag, is what publishes
      # it, along with the five per-host executables it depends on.
      - name: Publish
        run: |
          for dir in packages/*/; do
            if [ "$dir" = "packages/cli/" ]; then
              continue
            fi
            npm publish "$dir" --provenance --access public || exit 1
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
