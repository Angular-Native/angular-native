[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/nesgarbo/angular-native"

[workspace.dependencies]
an-core = { path = "crates/an-core" }
an-layout = { path = "crates/an-layout" }
an-host = { path = "crates/an-host" }
slotmap = "1.1.1"
smallvec = "1"
thiserror = "2"
