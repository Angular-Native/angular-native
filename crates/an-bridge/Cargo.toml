[package]
name = "an-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
an-core.workspace = true
an-host.workspace = true
rquickjs = { version = "0.12", default-features = false, features = ["macro"] }
serde_json = "1.0.151"

# rquickjs-sys ships no pregenerated bindings for iOS: they have to be generated
# with bindgen, which on a Mac uses Xcode's libclang. watchOS does not ship them
# either —it is a tier 3 target, so even less so— and joins the same list.
[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "visionos", target_os = "watchos", target_os = "android"))'.dependencies]
rquickjs = { version = "0.12", default-features = false, features = ["macro", "bindgen"] }
