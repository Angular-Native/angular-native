[package]
name = "an-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The binary is called `an` and not `an-cli`: `cargo install --path crates/an-cli`
# leaves it on the PATH under the name the documentation uses, and from there it
# serves any Angular project without going through `cargo`.
[[bin]]
name = "an"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.6", features = ["derive"] }
notify = "8.2.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
