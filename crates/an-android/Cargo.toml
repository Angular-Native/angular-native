[package]
name = "an-android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The JVM loads a dynamic library; rlib so it can be tested from Rust.
crate-type = ["cdylib", "rlib"]

[dependencies]
an-bridge = { path = "../an-bridge" }
an-core.workspace = true
an-host.workspace = true
an-layout.workspace = true
serde_json = "1"

# Off Android the crate compiles empty, the same way an-ios does off iOS.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
libc = "0.2"
