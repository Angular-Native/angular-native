[package]
name = "an-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib to link from the SwiftUI shell; rlib so the model and the
# serialisation can be tested from Rust, on the Mac and with no simulator.
crate-type = ["staticlib", "rlib"]

[dependencies]
an-core.workspace = true
an-host.workspace = true
an-layout.workspace = true
an-bridge = { path = "../an-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

# watchOS ships a cut-down UIKit: there is no `UIView` and no view hierarchy,
# but there is `UIFont` and Foundation's string drawing. That is all that is
# needed here, because this host mounts no views: it only measures text so that
# taffy can place things. Off watchOS the crate compiles with the approximate
# measurer, so that the workspace's `cargo test` keeps working on the Mac.
[target.'cfg(target_os = "watchos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "NSString", "NSAttributedString", "NSDictionary", "NSValue", "NSGeometry",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std", "objc2-core-foundation",
  "UIFont", "UIFontDescriptor", "NSStringDrawing", "NSParagraphStyle", "NSText",
  "NSAttributedString",
] }
