[package]
name = "an-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib para enlazar desde Xcode; rlib para poder testear desde Rust.
crate-type = ["staticlib", "rlib"]

[dependencies]
an-core.workspace = true
an-host.workspace = true
an-bridge = { path = "../an-bridge" }
serde = { version = "1", features = ["derive"] }
an-layout.workspace = true
serde_json = "1.0.151"

# UIKit solo existe en plataformas Apple móviles. Fuera de ellas el crate
# compila vacío, para que `cargo test` del workspace siga funcionando en Mac.
#
# Las tres familias comparten la lista de dependencias porque comparten el
# host: `objc2-ui-kit` genera los enlaces sin mirar la disponibilidad del SDK,
# así que `UISwitch` compila también para tvOS aunque allí la clase no exista.
# Lo que no existe está en `src/family.rs`, y lo que hay que enlazar y sí falta
# —WebKit en tvOS— sale del binario por `cfg`.
[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "NSString", "NSAttributedString", "NSDictionary", "NSValue", "NSGeometry",
  # Las manías del teclado se ponen por nombre de propiedad: en iOS 26 sus
  # setters no están en la tabla de métodos de la clase.
  "NSKeyValueCoding",
  "NSURL", "NSURLSession", "NSURLRequest", "NSData", "NSOperation", "NSError", "NSURLResponse",
  "NSArray", "block2", "objc2-core-foundation",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std", "objc2-core-foundation", "objc2-quartz-core", "objc2-core-graphics",
  "UIFontDescriptor", "UIAccessibilityIdentification",
  # Las seis props de accesibilidad del contrato. `UIAccessibility` es la
  # categoría sobre `NSObject` con la etiqueta, la pista y el valor;
  # `UIAccessibilityConstants`, los traits, que es donde encaja el rol.
  "UIAccessibility", "UIAccessibilityConstants",
  "UIView", "UILabel", "UIImageView", "UIImage", "UIColor", "UIFont",
  "UIResponder", "UIScreen", "UIScrollView", "UITextField", "UIControl",
  "UISwitch", "UISlider", "UIActivityIndicatorView", "UIProgressView", "UIButton",
  "UITabBar", "UITabBarItem", "UIBarItem", "UIImage", "UITabBarAppearance", "UIBarAppearance", "UITabBarController", "UITab", "UITabGroup", "UIViewController", "UITraitCollection", "UITrait", "UIInterface",
  "UIAlertController", "UIAlert", "UIViewController", "UIWindow", "UIRefreshControl",
  "UIGestureRecognizer", "UITapGestureRecognizer", "UITextInputTraits", "UIDevice",
  "UISheetPresentationController", "UIPresentationController", "UIPopoverPresentationController", "UIPopoverSupport", "UIViewController",
  "UIImageSymbolConfiguration", "UIImageConfiguration",
  "UISegmentedControl", "UIStepper", "UISearchBar", "UIDatePicker", "UISearchTextField",
  "UIButtonConfiguration", "UITextView", "UINavigationBar", "UINavigationItem",
  "UIBarButtonItem", "NSTextContainer",
  "UIMenu", "UIMenuElement", "UIAction", "UIContextMenuInteraction",
  "UILongPressGestureRecognizer", "UISwipeGestureRecognizer", "UIPinchGestureRecognizer",
  "UIRotationGestureRecognizer",
  "UIBezierPath", "UIScreenEdgePanGestureRecognizer", "UIPanGestureRecognizer",
  "UIGeometry", "block2",
  "NSStringDrawing", "NSParagraphStyle", "NSText", "NSAttributedString",
  # El motor de foco (tvOS) y el realce de la mirada (visionOS). Se piden en
  # las tres familias porque la lista de features es una sola; lo que decide
  # quién los usa es el `cfg` de `focus.rs` y `hover.rs`.
  "UIFocus", "UIFocusAnimationCoordinator", "UIFocusUpdateContext_UIKitAdditions",
  "UIPress", "UIHoverStyle",
] }

[dev-dependencies]
an-core.workspace = true
