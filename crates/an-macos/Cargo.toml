[package]
name = "an-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib so that `swiftc` links the shell against it; rlib so the inventory
# of primitives can be tested from Rust without opening any window.
crate-type = ["staticlib", "rlib"]

[dependencies]
an-core.workspace = true
an-host.workspace = true
an-layout.workspace = true
an-bridge = { path = "../an-bridge" }

# AppKit only exists on macOS. What is left off it is the inventory of
# primitives, which touches no platform, so that the workspace's `cargo test`
# keeps running on any machine.
#
# Unlike `objc2-ui-kit`, no class has to be declared by hand here:
# `objc2-app-kit` generates real macOS, which is the platform these crates
# cover first.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "NSString", "NSAttributedString", "NSDictionary", "NSValue", "NSGeometry",
  "NSURL", "NSURLSession", "NSURLRequest", "NSData", "NSOperation", "NSError",
  "NSURLResponse", "NSArray", "NSDate", "NSRange", "block2", "objc2-core-foundation",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std", "CALayer", "objc2-core-foundation", "objc2-core-graphics",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "objc2-core-foundation", "objc2-quartz-core", "objc2-core-graphics",
  "NSFontDescriptor", "NSParagraphStyle", "NSScroller", "NSResponder", "NSView", "NSWindow", "NSApplication", "NSColor", "NSFont",
  "NSTextField", "NSTextFieldCell", "NSControl", "NSCell", "NSActionCell",
  "NSButton", "NSButtonCell", "NSSwitch", "NSSlider", "NSSliderCell",
  "NSProgressIndicator", "NSScrollView", "NSClipView", "NSImageView", "NSImage",
  "NSImageCell", "NSSegmentedControl", "NSSegmentedCell", "NSStepper",
  "NSStepperCell", "NSSearchField", "NSSearchFieldCell", "NSPopUpButton",
  "NSPopUpButtonCell", "NSMenu", "NSMenuItem", "NSDatePicker", "NSDatePickerCell",
  "NSTextView", "NSText", "NSTextContainer", "NSAlert", "NSPanel",
  "NSGestureRecognizer", "NSClickGestureRecognizer", "NSPanGestureRecognizer",
  "NSPressGestureRecognizer", "NSMagnificationGestureRecognizer",
  "NSRotationGestureRecognizer", "NSTrackingArea", "NSEvent", "NSCursor",
  "NSAttributedString", "NSParagraphStyle", "NSStringDrawing", "NSAnimationContext",
  "NSGraphics", "NSGraphicsContext", "NSAccessibilityProtocols",
  # AppKit's roles and subroles, which are the other set: UIKit's are bits of
  # a mask and these are strings.
  "NSAccessibilityConstants", "NSUserInterfaceItemIdentification",
  "NSLayoutConstraint", "NSAppearance", "NSColorSpace", "block2",
] }

[dev-dependencies]
an-core.workspace = true
